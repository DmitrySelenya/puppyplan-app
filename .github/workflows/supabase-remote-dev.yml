name: Supabase Remote Dev

on:
  pull_request:
    paths:
      - .github/workflows/supabase-remote-dev.yml
      - package-lock.json
      - package.json
      - scripts/checks/check-database-types-generated.mjs
      - scripts/checks/supabase-baseline.test.mjs
      - scripts/supabase/**
      - src/contracts/**
      - src/lib/supabase/**
      - supabase/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-remote-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remote-dev-schema:
    name: Remote Dev Schema Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Fork pull requests never receive repository secrets, and must never be able to
    # reach the hosted dev database. Skip the job instead of failing it confusingly.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      SUPABASE_PROJECT_REF: olymqppxsadsxfrcyskh
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.PUPPYPLAN_DEV_SUPABASE_DB_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate remote dev secrets
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::error::Set the PUPPYPLAN_DEV_SUPABASE_DB_URL repository secret for the non-production dev database."
            exit 1
          fi
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::Set the SUPABASE_ACCESS_TOKEN repository secret for hosted-project type generation."
            exit 1
          fi

      - name: Run remote Supabase schema gate
        run: npm run supabase:ci:remote

      - name: Upload generated database types
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          name: database-types
          path: src/contracts/database.types.ts
