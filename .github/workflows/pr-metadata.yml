name: PR Metadata

on:
  pull_request:
    types:
      - edited
      - opened
      - ready_for_review
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  work-tracking:
    name: Work Tracking
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Derive PR metadata from branch
        id: derive-metadata
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/checks/pr-metadata-autofill.mjs --github-output "$GITHUB_OUTPUT"

      - name: Validate PR title and body
        env:
          PR_BODY: ${{ steps.derive-metadata.outputs.body }}
          PR_TITLE: ${{ steps.derive-metadata.outputs.title }}
        run: node scripts/checks/pr-metadata.mjs
